name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Unpack project
        run: |
          if [ -f RangMausam-src.zip ]; then unzip -o -q RangMausam-src.zip; fi
          ls -la . app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk RangMausam.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rang Mausam (latest build)
          body: Open this page on your phone and tap RangMausam.apk to install.
          files: RangMausam.apk
          make_latest: true
