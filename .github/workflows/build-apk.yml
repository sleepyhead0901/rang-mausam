name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Unpack project
        run: |
          if [ -f RangMausam-src.zip ]; then unzip -o -q RangMausam-src.zip; fi
          ls -la . app
          grep -c "class RagaWidget" app/src/main/java/com/rangmausam/Widgets.kt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk RangMausam-1.1-build${{ github.run_number }}.apk
      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: RangMausam-build${{ github.run_number }}
          path: RangMausam-1.1-build${{ github.run_number }}.apk
      - name: Publish a new release for this build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rang Mausam build ${{ github.run_number }}
          body: Open this page on your phone and tap the .apk file to install.
          files: RangMausam-1.1-build${{ github.run_number }}.apk
          make_latest: true
